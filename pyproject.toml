[project]
name = "riprap"
version = "0.6.0"
description = "Composable, citation-grounded civic climate-exposure briefings for any US place."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Adam Munawar Rahman", email = "msrahmanadam@gmail.com" },
]
keywords = [
    "civic-tech",
    "open-data",
    "flood-risk",
    "climate-exposure",
    "citation-grounded",
    "rag",
    "grounded-llm",
    "fema",
    "noaa",
    "socrata",
    "ckan",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Sociology",
    "Typing :: Typed",
]

dependencies = [
    # Web, streaming, agent tool surface
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "mcp>=2.2,<3",
    "apache-burr>=0.43,<1",
    # Geo and data
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
    "rasterio>=1.4,<2",
    "geopy>=2.4,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18.0,<25",
    "numpy>=1.26,<3",
    "dataretrieval>=1.3,<2",
    # PDF export (needs system pango and cairo)
    "weasyprint>=68,<70",
    # LLM client (replaced in a later phase)
    "litellm>=1.83.14,<2",
    # ML: embeddings, NER, TTM
    "datasets>=3.0,<5",
    "sentence-transformers>=3.3,<4",
    "codecarbon>=2.5,<4",
    "pypdf>=5.0,<7",
    "transformers>=4.55,<5",
    "huggingface_hub>=0.34,<1",
    "flair>=0.13.0,<0.16",
    "granite-tsfm>=0.3.0,<0.4",
    # EO chip fetch
    "planetary-computer>=1.0,<2",
    "pystac-client>=0.7,<1",
    "rioxarray>=0.15,<1",
    "xarray>=2024.1",
    "einops>=0.7,<1",
    "openai>=1.60,<3",
]

[project.urls]
Homepage      = "https://github.com/msradam/riprap"
Documentation = "https://github.com/msradam/riprap/blob/main/docs/INDEX.md"
Repository    = "https://github.com/msradam/riprap"
Issues        = "https://github.com/msradam/riprap/issues"
Changelog     = "https://github.com/msradam/riprap/blob/main/CHANGELOG.md"
"Legacy Demo (frozen, data probes only)" = "https://lablab-ai-amd-developer-hackathon-riprap-nyc.hf.space"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=9.0",
    "vulture>=2.13",
    "radon>=6.0",
    "pyupgrade>=3.20",
    "refurb>=2.1",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["riprap*", "app*"]
exclude = [
    "tests*", "scripts*", "experiments*", "load*", "examples*",
    "deployments*", "docs*", "web*", "outputs*", "data*", "corpus*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "corpus", "outputs"]

[tool.ruff.lint]
# Pyflakes (real bug class) + import + bugbear; skip purely stylistic rules
# (E701/E702 multi-statement-per-line) where the compact form is intentional
# in our FSM error-recording one-liners.
select = ["F", "E4", "E7", "E9", "I", "B", "UP"]
ignore = [
    "E701",  # one-line `if cond: stmt` — intentional in compact guards
    "E702",  # `a; b` — intentional in compact `rec["ok"] = False; rec["err"] = ...` pairs
    "E741",  # ambiguous var name (e.g. `l`) — accept context where it's clear
    "B008",  # function call in default arg — fine for httpx Timeout etc.
]

[tool.ruff.lint.per-file-ignores]
# Scripts use one-shot patterns we don't want to over-lint.
"scripts/*.py" = ["F841", "B007"]

[tool.vulture]
min_confidence = 80
ignore_decorators = ["@app.get", "@app.post", "@action"]
# Names that LOOK unused but are required by external API contracts:
#   request   — FastAPI route handler signature
#   query_id  — FastAPI captured-param routes that forward to the SvelteKit
#               SPA fallback (the SPA reads it from window.location)
#   engine    — _hardware_for() param sliced by docstring contract, not by body
ignore_names = ["request", "query_id", "engine"]
paths = ["app", "web", "scripts", "riprap"]
