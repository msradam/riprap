# Riprap: local and self-hosted.
#
# Default (no profile): the app alone, CPU only. With no LLM settings it
# serves the no-LLM evidence briefing.
#
#     docker compose up
#
# `local-llm` profile: adds an Ollama service and points the app at it.
#
#     docker compose --profile local-llm up -d
#     docker compose exec ollama ollama pull granite4:micro
#     RIPRAP_LLM_BASE_URL=http://ollama:11434/v1 RIPRAP_LLM_MODEL=granite4:micro \
#       docker compose --profile local-llm up -d
#
# Any other OpenAI-compatible endpoint works the same way: set
# RIPRAP_LLM_BASE_URL, RIPRAP_LLM_MODEL and, if it needs one,
# RIPRAP_LLM_API_KEY.

services:
  riprap-app:
    image: riprap:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "7860:7860"
    environment:
      - RIPRAP_LLM_BASE_URL=${RIPRAP_LLM_BASE_URL:-}
      - RIPRAP_LLM_MODEL=${RIPRAP_LLM_MODEL:-}
      - RIPRAP_LLM_API_KEY=${RIPRAP_LLM_API_KEY:-}
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama-models:/root/.ollama
    profiles:
      - local-llm
    restart: unless-stopped

volumes:
  ollama-models:
