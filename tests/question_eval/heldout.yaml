# Held-out question set for refactor 3.
#
# Written before any v3 code change and before any arm was run on it.
# Every entry is author-written by the refactor author. No address or
# district here appears in questions.yaml. No data was looked up to write
# it: answer_should_mention names the concept an answer must address, not
# a value, so the set cannot be fitted to results.
#
# Targets (real NYC addresses, one per borough, plus one district):
#   elmhurst      79-01 Broadway, Queens, NY 11373          inland, Ida basement flooding area
#   coney-island  1310 Surf Avenue, Brooklyn, NY 11224      coastal
#   seaport       200 Water Street, Manhattan, NY 10038     coastal, Sandy
#   yankee        1 East 161st Street, Bronx, NY 10451      inland, near the Harlem River
#   snug-harbor   1000 Richmond Terrace, Staten Island, NY 10301  north shore waterfront
#   QN04          community district (Elmhurst, Corona)
#
# Fields as in questions.yaml. Mix: 5 flood_history, 3 right_now, 3 future,
# 5 asset, 2 district, 2 out_of_scope.

- id: h01
  kind: flood_history
  author: author-written
  target: elmhurst
  question: "Did the area around 79-01 Broadway, Queens flood during Hurricane Ida?"
  expected_intent: single_address
  must_run: [ida_hwm, nyc311, floodnet]
  irrelevant: [npcc4_slr, doe_schools, doh_hospitals, mta_entrances, nycha_developments]
  answer_should_mention: [["high-water mark", "high water mark"], ["311"]]

- id: h02
  kind: flood_history
  author: author-written
  target: coney-island
  question: "Was 1310 Surf Avenue, Brooklyn inside the area Hurricane Sandy flooded?"
