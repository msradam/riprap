# Question set for the v1 / v2 evaluation (refactor 2).
#
# Every entry is author-written: drafted by the refactor author from the
# gallery targets and the NYC pebble registry, not collected from users.
#
# Fields:
#   kind                   one of eight kinds: bare_address, flood_history, right_now, asset,
#                          future, district, out_of_scope, not_covered
#   expected_intent        single_address | neighborhood | live_now | out_of_scope
#   must_run               pebbles a competent analyst would need; missing one is a failure
#   irrelevant             pebbles that are waste for this question (not a failure)
#   answer_should_mention  facts the answer or body should contain; each item is a list of
#                          acceptable strings (case-insensitive substring match, any one counts)
#
# Facts come from the no-LLM gallery run of 2026-09-26 (web/sveltekit/src/lib/gallery/)
# and the district summaries for QN12 and BK15. Live sources (alerts, sensors, gauges)
# change between runs, so their items name the source, not a value.

- id: q01
  kind: bare_address
  author: author-written
  target: hollis
  question: "90-01 183rd Street, Queens, NY 11423"
  expected_intent: single_address
  must_run: [sandy, fema_nfhl, dep_extreme_2080, dep_moderate_2050, dep_moderate_current, ida_hwm, nyc311, floodnet]
  irrelevant: []
  answer_should_mention: [["outside"], ["zone x"], ["high-water mark", "high water mark"]]

