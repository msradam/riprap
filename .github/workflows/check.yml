name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uvx ruff check riprap/ web/main.py app/geocode.py app/planner.py app/areas/ tests/

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The data regression tests read the baked rasters, GeoJSON and
      # registers under data/, which live in Git LFS (about 210 MB).
      # Cache the LFS objects on their ids so CI downloads them once.
      - name: List LFS objects under data/
        run: git lfs ls-files -l -I "data/**" | cut -d' ' -f1 | sort > .lfs-data-ids
      - name: Cache LFS objects
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .git/lfs/objects
          key: lfs-data-${{ hashFiles('.lfs-data-ids') }}
      - name: Pull LFS data
        run: git lfs pull --include "data/**"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install deps (Python 3.12, locked)
        run: uv sync --frozen

      - name: Import smoke test
        run: uv run python -c "from riprap.core.burr import app; from riprap.mcp import server; from web import main"
        env:
          RIPRAP_SKIP_WARM: "1"

      # Every test that needs no network, LLM or running server. The
      # integration suite skips itself without a server.
      - name: Tests
        run: uv run pytest -q
        env:
          RIPRAP_SKIP_WARM: "1"

  # A fully offline probe_cities_smoke.py run would be ideal here, but
  # the current script hits real upstream APIs (NWS, Socrata, CKAN,
  # NOAA). Those endpoints are unauthed but rate-limited and
  # occasionally flaky; gating PRs on remote uptime is a poor trade.
  # The lint + tests jobs above cover the regression surface that
  # matters for code review. Run
  # `.venv/bin/python scripts/probe_cities_smoke.py http://127.0.0.1:7860`
  # locally before tagging a release — that's the 6/6 PASS gate.
