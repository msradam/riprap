name: Port to a new city
description: Plan a Riprap deployment for a city other than NYC.
title: "[port] "
labels: ["port", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Four city deployments ship in the repo: NYC, and experimental
        Chicago, Seattle and Albany. Each is a directory of YAML pebble
        manifests and a `stones.yaml`. Adding your city is a manifest
        directory, not a fork. Start with [`docs/PORT-YOUR-CITY.md`](https://github.com/msradam/riprap/blob/main/docs/PORT-YOUR-CITY.md).

        Adapters that probably already cover your data:
        - `socrata_records`: any Socrata SODA portal (NYC, Chicago, Seattle, DC, LA, Austin, Houston, ...)
        - `csv_points`, `baked_vector`, `rest_json`, `python_call`: everything else

        This issue helps you and reviewers scope the work before you
        open a PR. Riprap briefs on flooding only.
  - type: input
    id: city
    attributes:
      label: Target city / region
      placeholder: e.g. Houston, TX
    validations:
      required: true
  - type: textarea
    id: data_portal
    attributes:
      label: Open-data portal
      description: |
        URL of your jurisdiction's open-data portal and the platform it
        runs (Socrata, other). If Socrata, the existing adapter
        probably already works: list the resource IDs and the spatial
        field name (`location` or latitude and longitude columns) for
        the datasets you want to use.
      placeholder: |
        https://data.cityofchicago.org (Socrata). 311: v6vf-nfxy, spatial field `location`.
    validations:
      required: true
  - type: textarea
    id: cornerstone
    attributes:
      label: "Cornerstone: hazard memory"
      description: |
        Local historical inundation extents, regional DEM, regulatory
        floodplain maps. Include dataset URLs and licences. The FEMA
        flood zone is a federal pebble and comes for free.
    validations:
      required: true
  - type: textarea
    id: keystone
    attributes:
      label: "Keystone: asset registers"
      description: |
        Transit, housing, education and healthcare layers your
        jurisdiction publishes, as points or polygons.
    validations:
      required: true
  - type: textarea
    id: touchstone
    attributes:
      label: "Touchstone: live observation"
      description: |
        Live sensors and complaint streams. Most US cities publish 311
        or an equivalent. A 311 feed needs a reviewed list of its
        flood-related categories. NWS observations and USGS stream
        gauges are federal pebbles. Name the nearest NOAA water-level
        station and NWS observation station, since both are picked from
        fixed lists in `app/context/`.
    validations:
      required: true
  - type: textarea
    id: lodestone
    attributes:
      label: "Lodestone: forecast"
      description: |
        Local NWS water-level forecast gauges, regional surge or
        hydrologic forecasts, sea-level projections. NWS alerts are a
        federal pebble and work for any US address.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
