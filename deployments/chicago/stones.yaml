# Chicago, experimental: the federal sources plus a reviewed 311 flood
# filter (Chicago Data Portal) and the Lake Michigan water-level gauge.
# It has no local flood maps, sensors or asset registers.
deployment:
  experimental: true
coverage:
  bbox: [-87.95, 41.64, -87.52, 42.02]
  city: Chicago
  state: IL
stones:
  - id: cornerstone
    name: Cornerstone
    tagline: Mapped hazards
    description: Reads the FEMA flood zone for the address.
    order: 1
  - id: touchstone
    name: Touchstone
    tagline: Live readings
    description: Reads Chicago 311 flood requests, the Lake Michigan water-level gauge, stream gauges and weather observations.
    order: 2
  - id: keystone
    name: Keystone
    tagline: Places and facilities
    description: No asset register is read for Chicago yet.
    order: 3
  - id: lodestone
    name: Lodestone
    tagline: Projections
    description: Quotes active Weather Service alerts.
    order: 4
  - id: capstone
    name: Capstone
    tagline: The briefing
    description: Assembles the cited briefing from the evidence by fixed rules; an optional language model may only choose among the cited sentences.
    order: 5
