id: fema_nfhl
type: live
title: FEMA National Flood Hazard Layer, flood zone at this point
answers: "the FEMA regulatory flood zone and FIRM panel at the point"
stone: cornerstone
tier: modeled
adapter: python_call

# Federal pebble — FEMA's NFHL ArcGIS point query returns the effective
# regulatory flood zone for any mapped US point, plus the FIRM panel
# effective date (the map vintage FEMA 1.5 requires in citations).
# An unmapped point (open water, no effective FIRM) returns None and the
# pebble says nothing; a failed query raises and is listed as not checked.
coverage:
  region: us_conus

spatial:
  scope: point
  crs: EPSG:4326

config:
  module: app.context.fema_nfhl
  function: summary_for_point
  args:
    - {source: lat}
    - {source: lon}
  # None means the service answered and no effective map covers the
  # point: that is not a failure. A failed query raises (app/context/fema_nfhl.py)
  # and the run records the source as failed, as for the NYC preliminary map.
  on_none: passthrough

trace_summary:
  zone: fld_zone
  sfha: sfha
  panel: firm_panel
  vintage: effective_year

provenance:
  date_modified: at_fetch
  retrieved_at: at_fetch
  source_name: FEMA National Flood Hazard Layer (NFHL), effective flood zones
  source_url: https://hazards.fema.gov/femaportal/wps/portal/NFHLWMS
  license: U.S. Public Domain
  doc_id: fema_nfhl
  citation: FEMA NFHL effective flood-zone polygon and FIRM panel intersecting the address point.
  # The citation's vintage is the FIRM panel's effective date, not the read time.
  date_modified_field: effective_date

narration:
  short: FEMA National Flood Hazard Layer effective flood zone at this address.
  template: "{narrative}"

display:
  order: 12
  kind: stat
  map_layer: false
  icon: "🗺️"

fallback:
  on_offline: skip
  message: FEMA's NFHL service did not answer when this briefing ran.
