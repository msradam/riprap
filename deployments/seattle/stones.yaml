# Seattle, experimental: the federal sources plus a reviewed 311 flood
# filter (data.seattle.gov) and the Puget Sound water-level gauge. It has
# no local flood maps, sensors or asset registers.
deployment:
  experimental: true
coverage:
  bbox: [-122.46, 47.49, -122.22, 47.74]
  city: Seattle
  state: WA
stones:
  - id: cornerstone
    name: Cornerstone
    tagline: Mapped hazards
    description: Reads the FEMA flood zone for the address.
    order: 1
  - id: touchstone
    name: Touchstone
    tagline: Live readings
    description: Reads Seattle customer service flood requests, the Puget Sound water-level gauge, stream gauges and weather observations.
    order: 2
  - id: keystone
    name: Keystone
    tagline: Places and facilities
    description: No asset register is read for Seattle yet.
    order: 3
  - id: lodestone
    name: Lodestone
    tagline: Projections
    description: Quotes active Weather Service alerts.
    order: 4
  - id: capstone
    name: Capstone
    tagline: The briefing
    description: Assembles the cited briefing from the evidence by fixed rules; an optional language model may only choose among the cited sentences.
    order: 5
