# Albany, NY, experimental: the federal sources plus SeeClickFix flood
# reports and the Hudson water-level gauge at Albany (the Hudson is tidal
# to the Federal Lock at Troy; NOAA station 8518995). Albany takes its 311
# requests on SeeClickFix, so that source uses the python_call adapter.
# It has no local flood maps, sensors or asset registers.
deployment:
  experimental: true
coverage:
  bbox: [-73.90, 42.60, -73.72, 42.73]
  city: Albany
  state: NY
stones:
  - id: cornerstone
    name: Cornerstone
    tagline: The Hazard Reader
    description: Reads the FEMA flood zone for the address.
    order: 1
  - id: touchstone
    name: Touchstone
    tagline: The Live Observer
    description: Reads Albany SeeClickFix flood reports, the Hudson water-level gauge at Albany, stream gauges and weather observations.
    order: 2
  - id: keystone
    name: Keystone
    tagline: The Asset Register
    description: No asset register is read for Albany yet.
    order: 3
  - id: lodestone
    name: Lodestone
    tagline: The Projector
    description: Quotes active Weather Service alerts.
    order: 4
  - id: capstone
    name: Capstone
    tagline: The Synthesiser
    description: Writes the cited briefing from the evidence, with or without an LLM.
    order: 5
