id: albany_311
type: live
title: Albany flood-related 311 (SeeClickFix) service requests near this address
answers: "Albany SeeClickFix service requests within 300 m whose text reads as flooding, sewer backup or drainage problems (text classifier, experimental)"
stone: touchstone
maturity: experimental
adapter: python_call

spatial:
  scope: point
  crs: EPSG:4326

# Albany's 311 intake runs on SeeClickFix — there is no Socrata/CKAN
# export — so this pebble calls the SeeClickFix public API through
# app.context.seeclickfix, which returns the same records shape as the
# socrata_records adapter.
config:
  module: app.context.seeclickfix
  function: records_near
  args:
    - {source: lat}
    - {source: lon}
  kwargs:
    radius_m: {const: 300}
    # Keep records a text classifier reads as flood-related (refactor 4);
    # text is the resident's "summary: description", as in the System One experiment.
    record_filter:
      const:
        kind: flood_311_model
        text_fields: [summary, description]
        join: ": "
        id_field: id
        threshold: 0.0043
  on_none: offline

provenance:
  date_modified: at_fetch
  retrieved_at: at_fetch
  source_name: SeeClickFix — Albany, NY service requests (public API)
  source_url: https://seeclickfix.com/albany
  license: SeeClickFix public API terms
  doc_id: albany_311
  citation: SeeClickFix public API, all Albany service-request categories within 300 m of address.

narration:
  short: Flood-related Albany 311 (SeeClickFix) service requests within 300 m of this address.
  template: >-
    {n_kept} of {n_before_phrase} Albany 311 service requests within {radius_m} m of this
    address {filter_note}.

display:
  order: 20
  kind: list
  map_layer: true
  icon: "📞"

fallback:
  on_offline: skip
  message: SeeClickFix API unreachable.
