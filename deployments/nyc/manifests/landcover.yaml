id: landcover
type: baked
title: Land cover from satellite, TerraMind NYC adapter (experimental)
answers: "experimental estimate of how much of a place is paved or built over and how much is green, and whether that changed between the years mapped"
stone: cornerstone
maturity: experimental
tier: modeled
adapter: python_call

# Reads the saved outputs of scripts/run_landcover_batch.py in data/eo/. No
# model runs per request, and the app needs no extra to read them.
spatial:
  scope: point

config:
  module: app.eo.landcover
  function: for_point
  args:
    - {source: lat}
    - {source: lon}
  on_none: offline

provenance:
  date_modified: "2026"
  retrieved_at: 2026-10-01
  source_name: TerraMind NYC land-cover adapter (msradam, experimental) on Copernicus Sentinel-2
  source_url: https://huggingface.co/msradam/TerraMind-NYC-Adapters
  license: Apache-2.0 (model); Copernicus Sentinel data terms (imagery)
  doc_id: landcover
  citation: >-
    msradam/TerraMind-NYC-Adapters, adapter lulc_nyc (Apache-2.0), the owner's
    LoRA adapter on IBM and ESA's TerraMind 1.0, run by
    scripts/run_landcover_batch.py on Sentinel-2 L2A scenes (the adapter's
    radar and elevation inputs are left empty). Contains modified Copernicus
    Sentinel data, via Microsoft Planetary Computer. Experimental: a proxy from
    10 m pixels trained on ESA WorldCover 2021 labels, not a survey.

narration:
  short: Paved and green shares near this address, from a satellite land-cover model (experimental).
  template: "{narrative}"

fallback:
  on_offline: skip
  message: The saved land-cover output was not found on this server.

display:
  variant: raster
  order: 60
  kind: text
