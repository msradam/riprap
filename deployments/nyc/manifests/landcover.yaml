id: landcover
type: baked
title: Land cover from satellite, NYC land-cover model (experimental)
answers: "experimental estimate, from the latest satellite imagery, of how much of a place is paved or built over, how much is green and how much is tree canopy; it reads no change between years, and the city's 2017 map (city_landcover) is the measured source"
stone: cornerstone
hazard: any
maturity: experimental
tier: modeled
adapter: python_call

# Reads the saved outputs of scripts/run_landcover_batch.py in data/eo/. No
# model runs per request, and the app needs no extra to read them.
spatial:
  scope: point

config:
  module: app.eo.landcover
  function: for_point
  args:
    - {source: lat}
    - {source: lon}
  on_none: offline

provenance:
  date_modified: "2026"
  retrieved_at: 2026-10-02
  source_name: NYC land-cover model (Riprap, experimental) on Copernicus Sentinel-2, trained on NYC Land Cover 2017
  source_url: https://github.com/msradam/riprap/blob/main/docs/MODELS.md#nyc-land-cover-model
  license: Apache-2.0 (TerraMind 1.0 base); Copernicus Sentinel data terms (imagery); NYC Open Data Terms of Use (2017 training labels)
  doc_id: landcover
  citation: >-
    Riprap's NYC land-cover model, trained by scripts/train_cover.py on NYC
    Land Cover 2017 (6 inch, NYC Open Data) aggregated to 10 m and run by
    scripts/run_landcover_batch.py on Sentinel-2 L2A scenes; scored against
    NYC Land Cover 2021 (The Nature Conservancy and UVM) on squares it never
    trained on. Contains modified Copernicus Sentinel data, via Microsoft
    Planetary Computer. Experimental: an estimate from 10 m pixels, not a
    survey.

narration:
  short: Paved, green and tree canopy shares near this address, from a satellite land-cover model (experimental).
  template: "{narrative}"

fallback:
  on_offline: skip
  message: The saved land-cover output was not found on this server.

display:
  variant: raster
  order: 60
  kind: text
