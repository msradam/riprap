id: nycha_developments
type: baked
title: NYCHA developments exposed nearby
answers: "NYCHA public housing nearby inside a mapped flood extent (10% or more of a development's outline inside the 2012 Sandy extent, or its centre point inside a modeled DEP scenario; others are not listed) and how many sit in the Sandy extent or the DEP 2080 scenario"
stone: keystone
tier: empirical
adapter: python_call

spatial:
  scope: point
  crs: EPSG:4326

config:
  module: app.registers.exposure
  function: summary_for_point
  args:
    - {source: lat}
    - {source: lon}
    - {const: nycha}
  on_none: passthrough

trace_summary:
  n_developments: n_developments
  n_inside_sandy_2012: n_inside_sandy_2012
  n_in_dep_extreme_2080: n_in_dep_extreme_2080

provenance:
  date_modified: null
  retrieved_at: 2026-05-01
  source_name: NYCHA developments register
  source_url: https://data.cityofnewyork.us/Housing-Development/NYCHA-Public-Housing-Developments/phvi-damg
  license: NYC Open Data Terms of Use
  doc_id: nycha_development_exposure
  citation: NYCHA public housing developments, cross-referenced with Sandy 2012 + DEP extreme 2080.

narration:
  template: "{narrative}"
  short: NYCHA developments within range of this address that are inside a mapped flood extent, from a register that lists only those.

display:
  variant: register
  order: 20
  kind: list
  map_layer: true
  icon: "🏢"

fallback:
  on_offline: skip
  message: The NYCHA developments list was not available when this briefing ran.
