id: nyc311_nta
type: baked
title: NYC 311 flood complaints in the area
answers: "flood-related 311 complaints inside the area over 3 years, by type"
stone: touchstone
tier: proxy
adapter: python_call

# Neighbourhood (polygon) evidence: runs for neighborhood and
# development_check queries against the resolved NTA polygon.
spatial:
  scope: polygon
  crs: EPSG:4326

config:
  module: app.areas.nta_evidence
  function: complaints
  args:
    - {source: polygon_4326}
  kwargs:
    query: {source: query}   # extras.area_code: a district counts by community_board
  on_none: offline

provenance:
  date_modified: at_fetch
  retrieved_at: at_fetch
  source_name: NYC 311 Service Requests (NYC Open Data)
  source_url: https://data.cityofnewyork.us/Social-Services/311-Service-Requests-from-2010-to-Present/erm2-nwe9
  license: NYC Open Data Terms of Use
  doc_id: nyc311_nta
  citation: NYC 311 Service Requests, flood-related complaints in the area (the sentence states how the area was counted, and the window).

narration:
  short: Flood-related 311 complaints in this area.
  template: "{narrative}"

display:
  order: 20
  kind: text
  icon: "📞"

fallback:
  on_offline: skip
