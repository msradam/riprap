id: nyc311_nta
type: baked
title: NYC 311 complaints about flooding and sewer backups in the area (3y)
answers: "311 complaints about flooding and sewer backups inside the area over 3 years, by type"
stone: touchstone
tier: proxy
adapter: python_call

# Neighbourhood (polygon) evidence: runs for neighborhood and
# development_check queries against the resolved NTA polygon.
spatial:
  scope: polygon
  crs: EPSG:4326

config:
  module: app.areas.nta_evidence
  function: complaints
  args:
    - {source: polygon_4326}
  kwargs:
    query: {source: query}   # extras.area_code: a district counts by community_board
  on_none: offline

provenance:
  date_modified: at_fetch
  retrieved_at: at_fetch
  source_name: NYC 311 Service Requests (NYC Open Data)
  source_url: https://data.cityofnewyork.us/Social-Services/311-Service-Requests-from-2020-to-Present/erm2-nwe9
  license: NYC Open Data Terms of Use
  doc_id: nyc311_nta
  citation: >-
    NYC 311 Service Requests from 2020 to Present (NYC Open Data dataset
    erm2-nwe9), complaints about flooding and sewer backups in the area (the
    sentence states
    how the area was counted, and the window). A neighbourhood is counted
    from the rows in its bounding box that fall inside its outline; a
    community district by the record's community_board field.
    Counted: requests of complaint type "Sewer" or "Sewer Maintenance" whose
    descriptor is one of eleven flood and sewer descriptors (street flooding,
    sewer backup, catch basin, highway flooding, manhole overflow and rain
    garden flooding, under their coded and plain names; the list is in
    app/context/nyc311.py), created on or after the start date the sentence
    gives (midnight UTC, 365 days for each year of the window). A request
    filed under both descriptor names at the same place within ten minutes
    is counted once. This citation's query_url is the Socrata query for the
    counted rows, with no house number or coordinate selected.
    Complaints are shown at the block, never the house number.

narration:
  short: NYC 311 complaints about flooding and sewer backups in this area.
  template: "{narrative}"

display:
  order: 20
  kind: text
  icon: "📞"

fallback:
  on_offline: skip
