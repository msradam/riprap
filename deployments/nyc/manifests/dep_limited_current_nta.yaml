id: dep_limited_current_nta
type: baked
title: NYC Stormwater Flood Maps, Limited Flood (1.77 inches/hr) with Current Sea Levels, share of the area
answers: >-
  the share of the area in each category of the city's stormwater flood map "Limited Flood (1.77
  inches/hr) with Current Sea Levels": rainfall flooding. A modelled scenario (a design storm paired
  with a sea level), not a forecast
stone: cornerstone
tier: modeled
adapter: python_call

# Neighbourhood (polygon) evidence: runs for neighborhood and
# development_check queries against the resolved NTA polygon.
spatial:
  scope: polygon
  crs: EPSG:4326

config:
  module: app.areas.nta_evidence
  function: dep
  args:
    - {source: polygon_4326}
    - {const: dep_limited_current}
  on_none: offline

provenance:
  date_modified: 2024-07-03
  retrieved_at: 2026-10-05
  source_name: NYC Stormwater Flood Maps, Limited Flood (1.77 inches/hr) with Current Sea Levels
  source_url: https://data.cityofnewyork.us/Environment/NYC-Stormwater-Flood-Maps/9i7c-xyvv
  license: NYC Open Data Terms of Use
  doc_id: dep_limited_current_nta
  citation: >-
    NYC Stormwater Flood Maps (NYC Open Data 9i7c-xyvv, Department of Environmental Protection), map
    "Limited Flood (1.77 inches/hr) with Current Sea Levels", share of the area by the map's flooding
    categories. Riprap reads this map from the vector tiles of DEP's own map viewer
    (nyc.gov/stormwater-map, tile service Moderate_5yearMHHW_updateOB_VTile1_61424), because the NYC
    Open Data file for it is a compressed geodatabase that open tools cannot read; the other three maps
    are read from the NYC Open Data files. The viewer's tiles and the Open Data files are not identical
    where both can be read (for the Moderate map with current sea levels the deep and contiguous
    category matches and the nuisance category differs by about a tenth of its area), so this reading
    may differ from the Open Data file for the Limited map. Map disclaimer, from DEP's own map items
    (arcgis.com/home/item.html?id=5b82c08be55d4f30bf28d265ab8e4a49): the map "is intended to be an
    informational tool and does not provide the exact depth of flooding at any location", shows "the
    relative risk of flooding in public areas from stormwater runoff due to rain only", and "shall not
    be used for the design, modification, or construction of improvements to real property or for flood
    plain determination". The caveat on an outside reading quotes NYC Emergency Management, Hazard
    Mitigation Plan, flooding profile
    (https://nychazardmitigation.com/documentation/hazard-profiles/flooding/).

narration:
  short: Share of this area in each category of the city's stormwater flood map "Limited Flood (1.77 inches/hr) with Current Sea Levels".
  template: "{narrative}"

