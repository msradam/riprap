id: dep_moderate_current
type: baked
title: NYC Stormwater Flood Map - Moderate Flood (2.13 inches/hr) with Current Sea Levels
answers: >-
  what the city's stormwater flood map "Moderate Flood (2.13 inches/hr) with Current Sea Levels" shows
  at the point: a rainfall flooding category, or none. A modelled scenario (a design storm paired with
  a sea level), not a forecast
stone: cornerstone
tier: modeled
adapter: python_call
shaper: dep_scenario

spatial:
  scope: point
  crs: EPSG:4326

config:
  module: app.flood_layers.dep_stormwater
  function: at_point
  args:
    - {source: pt_2263}
    - {const: dep_moderate_current}
  on_none: passthrough

trace_summary:
  category: category
  category_code: category_code
  edge_m: edge_m

provenance:
  date_modified: 2024-07-03
  retrieved_at: 2026-07-11
  source_name: NYC Stormwater Flood Maps (method of the 2021 Stormwater Resiliency Plan; Open Data files of 2024), Moderate Flood (2.13 inches/hr) with Current Sea Levels
  source_url: https://data.cityofnewyork.us/Environment/NYC-Stormwater-Flood-Maps/9i7c-xyvv
  license: NYC Open Data Terms of Use
  doc_id: dep_moderate_current
  citation: >-
    NYC Stormwater Flood Maps (NYC Open Data 9i7c-xyvv, Department of Environmental Protection), map
    "Moderate Flood (2.13 inches/hr) with Current Sea Levels". Map disclaimer, from DEP's own map items
    (arcgis.com/home/item.html?id=5b82c08be55d4f30bf28d265ab8e4a49): the map "is intended to be an
    informational tool and does not provide the exact depth of flooding at any location", shows "the
    relative risk of flooding in public areas from stormwater runoff due to rain only", and "shall not
    be used for the design, modification, or construction of improvements to real property or for flood
    plain determination". The caveat on an outside reading quotes NYC Emergency Management, Hazard
    Mitigation Plan, flooding profile
    (https://nychazardmitigation.com/documentation/hazard-profiles/flooding/).

narration:
  short: What the city's stormwater flood map "Moderate Flood (2.13 inches/hr) with Current Sea Levels" shows at this address, a modelled scenario and not a forecast.
  template: "{narrative}"

fallback:
  on_offline: skip
  message: The city's stormwater flood map "Moderate Flood (2.13 inches/hr) with Current Sea Levels" was not available when this briefing ran.

display:
  variant: headline
  order: 23
  kind: text
  map_layer: true
  icon: "💧"
