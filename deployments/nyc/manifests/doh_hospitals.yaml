id: doh_hospitals
type: baked
title: NYC DOH hospitals exposed nearby
answers: "hospitals nearby and how many sit in the Sandy extent or the DEP 2080 scenario"
stone: keystone
tier: empirical
adapter: python_call

spatial:
  scope: point
  crs: EPSG:4326

config:
  module: app.registers.exposure
  function: summary_for_point
  args:
    - {source: lat}
    - {source: lon}
    - {const: doh_hospitals}
  on_none: passthrough

trace_summary:
  n_hospitals: n_hospitals
  n_inside_sandy_2012: n_inside_sandy_2012
  n_in_dep_extreme_2080: n_in_dep_extreme_2080

provenance:
  date_modified: null
  retrieved_at: 2026-07-11
  source_name: NYS DOH hospitals register
  source_url: https://health.data.ny.gov/Health/Health-Facility-General-Information/vn5v-hh5r
  license: Health Data NY (New York State open data) terms of use
  doc_id: doh_hospital_exposure
  citation: NYS DOH Health Facility General Information (vn5v-hh5r) hospitals in NYC, cross-referenced with Sandy 2012 + DEP extreme 2080.

narration:
  template: "{narrative}"
  short: NYC DOH-licensed hospitals within range of this address and their flood exposure.

display:
  variant: register
  order: 40
  kind: list
  map_layer: true
  icon: "🏥"

fallback:
  on_offline: skip
  message: The DOH hospitals list was not available when this briefing ran.
