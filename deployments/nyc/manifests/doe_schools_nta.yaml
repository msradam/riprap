id: doe_schools_nta
type: baked
title: NYC DOE schools exposed in the area
answers: "flood-exposed public schools in the area (the register lists only exposed schools) and how many sit in the Sandy extent or the DEP 2080 scenario"
stone: keystone
tier: empirical
adapter: python_call

# The area version of the register: every listed asset inside the
# neighbourhood or the outline drawn for a community district.
spatial:
  scope: polygon
  crs: EPSG:4326

config:
  module: app.areas.nta_evidence
  function: assets
  args:
    - {source: polygon_4326}
    - {const: doe_schools}
  on_none: offline

trace_summary:
  n_schools: n_schools
  n_inside_sandy_2012: n_inside_sandy_2012
  n_in_dep_extreme_2080: n_in_dep_extreme_2080

provenance:
  date_modified: 2019-09-11
  retrieved_at: 2026-05-01
  source_name: NYC DOE, schools register
  source_url: https://data.cityofnewyork.us/Education/2019-2020-School-Locations/wg9x-4ke6
  license: NYC Open Data Terms of Use
  doc_id: doe_school_exposure
  citation: NYC DOE schools, cross-referenced with Sandy 2012 + DEP extreme 2080.

narration:
  template: "{narrative}"
  short: Flood-exposed NYC DOE schools inside this area, from a register that lists only exposed schools.

display:
  variant: register
  order: 30
  kind: list
  icon: "🏫"

fallback:
  on_offline: skip
  message: The DOE schools list was not available when this briefing ran.
