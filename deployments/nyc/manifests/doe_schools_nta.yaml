id: doe_schools_nta
type: baked
title: Public schools in mapped flood extents in the area
answers: "public schools in the area, charter schools included, from the 2019 to 2020 school locations (only schools inside an extent are listed), and how many sit in the Sandy extent or the modeled DEP 2080 scenario"
stone: keystone
tier: empirical
adapter: python_call

# The area version of the register: every listed asset inside the
# neighbourhood or the outline drawn for a community district.
spatial:
  scope: polygon
  crs: EPSG:4326

config:
  module: app.areas.nta_evidence
  function: assets
  args:
    - {source: polygon_4326}
    - {const: doe_schools}
  on_none: offline

trace_summary:
  n_schools: n_schools
  n_inside_sandy_2012: n_inside_sandy_2012
  n_in_dep_extreme_2080: n_in_dep_extreme_2080

provenance:
  date_modified: 2019-09-04
  retrieved_at: 2026-05-01
  source_name: NYC Department of Education, 2019 - 2020 School Point Locations (public schools, charter schools included)
  source_url: https://data.cityofnewyork.us/Education/2019-2020-School-Point-Locations/a3nt-yts4
  license: NYC Open Data Terms of Use
  doc_id: doe_school_exposure
  citation: NYC public schools, charter schools included (2019 to 2020 school locations), cross-referenced with Sandy 2012 + DEP extreme 2080.

narration:
  template: "{narrative}"
  short: Public schools (2019 to 2020 school locations, charter schools included) inside this area that are inside a mapped flood extent.

display:
  variant: register
  order: 30
  kind: list
  icon: "🏫"

fallback:
  on_offline: skip
  message: The public schools list was not available when this briefing ran.
