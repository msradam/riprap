  citation: >-
    NYC Stormwater Flood Maps (NYC Open Data 9i7c-xyvv, Department of Environmental Protection), map
    "Limited Flood (1.77 inches/hr) with Current Sea Levels". Riprap reads this map from the vector
    tiles of DEP's own map viewer (nyc.gov/stormwater-map, tile service
    Moderate_5yearMHHW_updateOB_VTile1_61424), because the NYC Open Data file for it is a compressed
    geodatabase that open tools cannot read; the other three maps are read from the NYC Open Data files.
    The viewer's tiles and the Open Data files are not identical where both can be read (for the
    Moderate map with current sea levels the deep and contiguous category matches and the nuisance
    category differs by about a tenth of its area), so this reading may differ from the Open Data file
    for the Limited map. Map disclaimer, from DEP's own map items
    (arcgis.com/home/item.html?id=5b82c08be55d4f30bf28d265ab8e4a49): the map "is intended to be an
    informational tool and does not provide the exact depth of flooding at any location", shows "the
    relative risk of flooding in public areas from stormwater runoff due to rain only", and "shall not
    be used for the design, modification, or construction of improvements to real property or for flood
    plain determination". The caveat on an outside reading quotes NYC Emergency Management, Hazard
    Mitigation Plan, flooding profile
    (https://nychazardmitigation.com/documentation/hazard-profiles/flooding/).

narration:
  short: What the city's stormwater flood map "Limited Flood (1.77 inches/hr) with Current Sea Levels" shows at this address, a modelled scenario and not a forecast.
