id: dep_extreme_2080_nta
type: baked
title: NYC Stormwater Flood Maps, Extreme Flood (3.66 inches/hr) with 2080 Sea Level Rise, share of the area
answers: >-
  the share of the area in each category of the city's stormwater flood map "Extreme Flood (3.66
  inches/hr) with 2080 Sea Level Rise": rainfall flooding, and the future high tide category. A
  modelled scenario (a design storm paired with a sea level), not a forecast
stone: cornerstone
tier: modeled
adapter: python_call

# Neighbourhood (polygon) evidence: runs for neighborhood and
# development_check queries against the resolved NTA polygon.
spatial:
  scope: polygon
  crs: EPSG:4326

config:
  module: app.areas.nta_evidence
  function: dep
  args:
    - {source: polygon_4326}
    - {const: dep_extreme_2080}
  on_none: offline

provenance:
  date_modified: 2024-07-03
  retrieved_at: 2026-07-11
  source_name: NYC Stormwater Flood Maps (method of the 2021 Stormwater Resiliency Plan; Open Data files of 2024), Extreme Flood (3.66 inches/hr) with 2080 Sea Level Rise
  source_url: https://data.cityofnewyork.us/Environment/NYC-Stormwater-Flood-Maps/9i7c-xyvv
  license: NYC Open Data Terms of Use
  doc_id: dep_extreme_2080_nta
  citation: >-
    NYC Stormwater Flood Maps (NYC Open Data 9i7c-xyvv, Department of Environmental Protection), map
    "Extreme Flood (3.66 inches/hr) with 2080 Sea Level Rise", share of the area by the map's flooding
    categories. The Stormwater Resiliency Plan (2021) describes its extreme scenario as "approximately
    3.5 inches of rain falling in one hour (also referred to as the 100-year storm, with approximately 1
    percent chance of occurrence in any given year) combined with 4.8 feet of SLR". Map disclaimer, from
    DEP's own map items (arcgis.com/home/item.html?id=5b82c08be55d4f30bf28d265ab8e4a49): the map "is
    intended to be an informational tool and does not provide the exact depth of flooding at any
    location", shows "the relative risk of flooding in public areas from stormwater runoff due to rain
    only", and "shall not be used for the design, modification, or construction of improvements to real
    property or for flood plain determination". The caveat on an outside reading quotes NYC Emergency
    Management, Hazard Mitigation Plan, flooding profile
    (https://nychazardmitigation.com/documentation/hazard-profiles/flooding/).

narration:
  short: Share of this area in each category of the city's stormwater flood map "Extreme Flood (3.66 inches/hr) with 2080 Sea Level Rise".
  template: "{narrative}"

display:
  order: 20
  kind: text
  icon: "🌧️"

fallback:
  on_offline: skip
