id: fema_pfirm
type: live
title: FEMA preliminary flood map (PFIRM), flood zone at this point
answers: "the preliminary FEMA flood zone (2015 PFIRM) at the point, which NYC Building Code Appendix G adopts for flood-resistant construction alongside the 2007 effective FIRM"
stone: cornerstone
tier: modeled
adapter: python_call

# NYC's effective FIRM dates from 2007. FEMA issued preliminary maps on
# 2015-01-30 (community 360497), which the City appealed and FEMA agreed to
# revise; until revised maps take effect, NYC Building Code Appendix G
# (G102.2.1, G102.2.2) adopts the PFIRM for flood-resistant construction
# and requires the more restrictive of the two maps. A planner asks about
# this map within minutes, so it is a source of its own, labelled
# preliminary. Sources: FEMA's preliminary NFHL service, NYC's flood map
# pages (nyc.gov/site/floodmaps) and NYC Building Code Appendix G.
spatial:
  scope: point
  crs: EPSG:4326

config:
  module: app.context.fema_nfhl
  function: preliminary_for_point
  args:
    - {source: lat}
    - {source: lon}
  # None means the service answered and no preliminary study covers the
  # point: that does not apply here, it is not a failure. A failed query
  # raises and is listed as not checked.
  on_none: passthrough

trace_summary:
  zone: fld_zone
  sfha: sfha
  bfe_ft: static_bfe_ft
  issued: issue_date

provenance:
  date_modified: at_fetch
  retrieved_at: at_fetch
  source_name: FEMA Preliminary National Flood Hazard Layer (Prelim_NFHL), preliminary flood zones
  source_url: https://hazards.fema.gov/arcgis/rest/services/PrelimPending/Prelim_NFHL/MapServer
  license: U.S. Public Domain
  doc_id: fema_pfirm
  citation: >-
    FEMA preliminary flood-zone polygon (PFIRM) intersecting the address point, with the issue date
    from the service's Preliminary Data Availability layer. Which map is used for what is from the
    NYC Hazard Mitigation Plan, flooding profile
    (https://nychazardmitigation.com/documentation/hazard-profiles/flooding/): "New York City
    applies whichever map (2015 PFIRMs or 2007 FIRMs) is the more restrictive of the two for
    Building Code and zoning purposes" and "FEMA uses the 2007 FIRMs for compliance with NFIP".
  # The citation's vintage is the date FEMA issued the preliminary study.
  date_modified_field: issue_date

narration:
  short: FEMA preliminary flood map (PFIRM) zone at this address.
  # The second sentence is New York City's own account of which map is used
  # for what (NYC Hazard Mitigation Plan, flooding profile; nyc.gov/site/floodmaps).
  template: >-
    {narrative} New York City applies whichever of the 2015 preliminary maps or the 2007 effective
    maps is more restrictive for Building Code and zoning purposes, and FEMA uses the 2007 effective
    maps for the National Flood Insurance Program (NYC Hazard Mitigation Plan, flooding profile).

display:
  order: 13
  kind: stat
  map_layer: false
  icon: "🗺️"

fallback:
  on_offline: skip
  message: FEMA's preliminary NFHL service did not answer when this briefing ran.
