id: dob_permits_nta
type: baked
title: Construction jobs in the older DOB permit file inside the neighborhood
answers: "construction jobs with a recent permit in the Buildings Department's older file (not DOB NOW) and how many sit in Sandy or DEP flood extents"
stone: keystone
tier: empirical
adapter: python_call

# Neighbourhood (polygon) evidence: runs for neighborhood and
# development_check queries against the resolved NTA polygon.
spatial:
  scope: polygon
  crs: EPSG:4326

config:
  module: app.areas.nta_evidence
  function: permits
  args:
    - {source: polygon_4326}
  on_none: offline

provenance:
  date_modified: at_fetch
  retrieved_at: at_fetch
  source_name: NYC DOB Permit Issuance (NYC Open Data; the older BIS file, without DOB NOW filings)
  source_url: https://data.cityofnewyork.us/Housing-Development/DOB-Permit-Issuance/ipu4-2q9a
  license: NYC Open Data Terms of Use
  doc_id: dob_permits_nta
  citation: NYC DOB Permit Issuance (ipu4-2q9a; DOB NOW filings not included) inside the neighborhood, cross-referenced with Sandy 2012 and DEP scenarios

narration:
  short: Recently permitted construction jobs in the older DOB permit file inside this neighborhood and their flood exposure.
  template: "{narrative}"

display:
  order: 30
  kind: text
  icon: "🏗️"

fallback:
  on_offline: skip
