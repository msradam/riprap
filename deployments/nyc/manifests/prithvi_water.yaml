id: prithvi_water
type: baked
title: New surface water after Hurricane Ida, Prithvi-EO (experimental)
answers: "experimental satellite-detected new surface water after Hurricane Ida (Sentinel-2, 2021-09-02) near an address, from the Prithvi-EO NYC model"
stone: cornerstone
maturity: experimental
tier: modeled
adapter: python_call

# Reads the precomputed outputs of scripts/run_eo_batch.py in data/eo/
# (refactor 8). Nothing runs per request.
spatial:
  scope: point
  crs: EPSG:4326

config:
  module: app.flood_layers.prithvi_water
  function: summary_for_point
  args:
    - {source: lat}
    - {source: lon}
  on_none: offline

trace_summary:
  new_water_m2_within_radius: new_water_m2_within_radius
  frac_observed_within_radius: frac_observed_within_radius

provenance:
  date_modified: 2021-09-02
  retrieved_at: 2026-09-28
  source_name: msradam/Prithvi-EO-2.0-NYC-Pluvial on Copernicus Sentinel-2 L2A (Planetary Computer)
  source_url: https://huggingface.co/msradam/Prithvi-EO-2.0-NYC-Pluvial
  license: Apache-2.0 (model); Copernicus Sentinel data terms (imagery)
  doc_id: prithvi_water
  citation: >-
    msradam/Prithvi-EO-2.0-NYC-Pluvial (Apache-2.0), run by scripts/run_eo_batch.py
    on Sentinel-2 L2A scenes from 2021-09-02 (tiles 18TWL, 18TWK, 18TXL), with
    same-tile scenes from 2021-08-13 masking permanent water. Contains modified
    Copernicus Sentinel data 2021, via Microsoft Planetary Computer. Experimental:
    no flood-detection score on held-out events; street and basement flooding
    is not visible at 10 to 20 m.

narration:
  short: New surface water after Hurricane Ida near this address, from the Prithvi-EO NYC model (experimental).
  template: "{narrative}"

fallback:
  on_offline: skip
  message: The Prithvi-EO Ida output (data/eo/) is not present.

display:
  variant: raster
  order: 40
  kind: text
  map_layer: true
  icon: "🛰️"
