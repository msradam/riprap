id: prithvi_water
type: baked
title: New surface water after Hurricane Ida and other storms, Prithvi-EO (experimental)
answers: "experimental satellite-detected new surface water after Hurricane Ida (Sentinel-2, 2021-09-02) and after other heavy rain since 2017, near an address"
stone: cornerstone
maturity: experimental
tier: modeled
adapter: python_call

# Reads the saved outputs of scripts/run_eo_batch.py in data/eo/. No model
# runs per request, and the app needs no extra to read them.
spatial:
  scope: point

config:
  module: app.flood_layers.prithvi_water
  function: summary_for_point
  args:
    - {source: lat}
    - {source: lon}
  on_none: offline

provenance:
  date_modified: 2021-09-02
  retrieved_at: 2026-10-01
  source_name: Prithvi-EO 2.0 NYC Pluvial (msradam, experimental) on Copernicus Sentinel-2 L2A
  source_url: https://huggingface.co/msradam/Prithvi-EO-2.0-NYC-Pluvial
  license: Apache-2.0 (model); Copernicus Sentinel data terms (imagery)
  doc_id: prithvi_water
  citation: >-
    msradam/Prithvi-EO-2.0-NYC-Pluvial (Apache-2.0), the owner's fine-tune of NASA and IBM's Prithvi-EO 2.0, run by scripts/run_eo_batch.py on Sentinel-2 L2A scenes from the day or two after heavy rain, with a same-tile scene from the month before masking permanent water. Contains modified Copernicus Sentinel data, via Microsoft Planetary Computer. Experimental: its labels were the base model's own output for Hurricane Ida, and street and basement flooding is not visible at 10 to 20 m.

narration:
  short: New surface water after Hurricane Ida near this address, from a satellite model (experimental).
  template: "{narrative}"

fallback:
  on_offline: skip
  message: The saved Prithvi-EO satellite output was not found on this server.

display:
  variant: raster
  order: 40
  kind: text
