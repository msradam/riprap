id: sandy
type: baked
title: NYC Sandy Inundation Zone (2012 empirical extent)
answers: "whether the point was inside the area Hurricane Sandy flooded in 2012"
stone: cornerstone
tier: empirical
adapter: python_call
# Wrap the bare bool the inside_raster function returns into a
# templatable dict so narration.template can phrase the outcome
# correctly for inside vs. outside. Without this, the templated
# reconciler can only fall back to narration.short — which can
# describe one outcome but not the other.
shaper: boolean_zone

spatial:
  scope: point
  crs: EPSG:4326

config:
  module: app.flood_layers.sandy_inundation
  function: at_point
  args:
    - {source: pt_2263}
  # at_point always returns a dict (inside, and the distance to the mapped
  # edge when it is near); passthrough keeps a False from reading as offline.
  on_none: passthrough

trace_summary:
  inside: inside
  edge_m: edge_m

provenance:
  date_modified: 2015-11-09
  retrieved_at: 2026-07-11
  source_name: NYC Open Data, Sandy Inundation Zone
  source_url: https://data.cityofnewyork.us/Environment/Sandy-Inundation-Zone/uyj8-7rv5
  license: NYC Open Data Terms of Use
  doc_id: sandy_inundation
  citation: NYC Sandy Inundation Zone (NYC OpenData uyj8-7rv5, empirical 2012 extent)

narration:
  short: The 2012 Hurricane Sandy inundation extent (NYC Open Data) at this address.
  template: This address {inside_phrasing} the empirical 2012 Hurricane Sandy inundation footprint (NYC Open Data){edge_note}.

fallback:
  on_offline: skip
  message: The 2012 Sandy inundation data was not available when this briefing ran.

display:
  variant: headline
  order: 10
  kind: stat
  map_layer: true
  icon: "🌊"
