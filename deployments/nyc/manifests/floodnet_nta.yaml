id: floodnet_nta
type: live
title: FloodNet ultrasonic depth sensors (NYC)
answers: "street flooding recorded by the FloodNet sensors inside a neighborhood or district: event counts over 3 years, peak depth and the streets with the most events"
stone: touchstone
tier: empirical
adapter: python_call

spatial:
  scope: polygon
  crs: EPSG:4326

config:
  module: app.context.floodnet
  function: summary_for_polygon
  args:
    - {source: polygon_4326}
  on_none: offline

trace_summary:
  n_sensors: n_sensors
  n_events_3y: n_flood_events_3y

provenance:
  date_modified: at_fetch
  retrieved_at: at_fetch
  # The project name FloodNet asks for in a credit.
  source_name: FloodNet (New York University and The City University of New York)
  # The API has no page per sensor or event; the dashboard shows both.
  source_url: https://dataviz.floodnet.nyc/
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
  attribution: FloodNet (New York University and The City University of New York)
  references:
    - >-
      Mydlarz, C., et al. (2024). FloodNet: Low-cost ultrasonic sensors for
      real-time measurement of hyperlocal, street-level floods in New York
      City. Water Resources Research, 60, e2023WR036806.
      https://doi.org/10.1029/2023WR036806
    - >-
      Silverman et al. (2022). Making Waves. Water Research, 118648.
      https://doi.org/10.1016/j.watres.2022.118648
  license_notice: >-
    FloodNet data and the content derived from it in this response (the
    FloodNet sentences and figures) are licensed CC BY-NC-SA 4.0, for
    non-commercial use with attribution and under the same licence. They
    are not covered by Riprap's Apache-2.0 licence. Riprap is independent
    of FloodNet, New York University and The City University of New York,
    and is not endorsed by them.
  doc_id: floodnet
  citation: >-
    FloodNet street flood sensors. Flood events and sensor status read from
    the FloodNet Data API (api.floodnet.nyc, an early-access beta) at the
    retrieval time shown. A flood event is a series of depth measurements
    greater than 10 mm at the sensor (FloodNet's definition); a depth is
    measured at one point and does not show the depth on every part of the
    street. Riprap counts the events the API marks as verified by a person.
    FloodNet's published cautions about a depth: "most FloodNet sensors are
    mounted over sidewalks and are thus unable to measure floods in the
    roadbed until the water rises above the height of the curb"; the depth at
    the street's lowest point differs from the reading by the sensor's height
    above that point; "a single anomalous data point, measured during a
    flood event" may exaggerate a maximum depth; and a sensor may miss a
    flood "if it was offline and awaiting repair or had not been deployed
    yet or retired" (FloodNet's NYC Open Data description, dataset aq7i-eu5q).
    Ten rows of FloodNet's deployments table are NOAA and USGS tide gauges
    (deploy_type "tidal"); Riprap does not count them as FloodNet sensors.
    Cite: Mydlarz et al. (2024), Water Resources Research 60, e2023WR036806,
    https://doi.org/10.1029/2023WR036806; Silverman et al. (2022), Water
    Research, 118648, https://doi.org/10.1016/j.watres.2022.118648.
    Licence: FloodNet data and content derived from it are CC BY-NC-SA 4.0
    (https://creativecommons.org/licenses/by-nc-sa/4.0/), not Riprap's
    Apache-2.0. Riprap is independent of FloodNet and not endorsed by it.

narration:
  short: FloodNet sensors and historical flood events inside this area.
  template: "{narrative}"

fallback:
  on_offline: skip
  message: FloodNet did not respond when this briefing ran.

display:
  variant: scalars
  order: 10
  kind: stat
  map_layer: true
  icon: "📡"
