id: nycha_developments_nta
type: baked
title: NYCHA developments exposed in the area
answers: "flood-exposed NYCHA public housing in the area (the register lists only exposed developments) and how many sit in the Sandy extent or the DEP 2080 scenario"
stone: keystone
tier: empirical
adapter: python_call

# The area version of the register: every listed asset inside the
# neighbourhood or the outline drawn for a community district.
spatial:
  scope: polygon
  crs: EPSG:4326

config:
  module: app.areas.nta_evidence
  function: assets
  args:
    - {source: polygon_4326}
    - {const: nycha}
  on_none: offline

trace_summary:
  n_developments: n_developments
  n_inside_sandy_2012: n_inside_sandy_2012
  n_in_dep_extreme_2080: n_in_dep_extreme_2080

provenance:
  date_modified: null
  retrieved_at: 2026-05-01
  source_name: NYCHA developments register
  source_url: https://data.cityofnewyork.us/Housing-Development/NYCHA-Public-Housing-Developments/phvi-damg
  license: NYC Open Data Terms of Use
  doc_id: nycha_development_exposure
  citation: NYCHA public housing developments, cross-referenced with Sandy 2012 + DEP extreme 2080.

narration:
  template: "{narrative}"
  short: Flood-exposed NYCHA developments inside this area, from a register that lists only exposed developments.

display:
  variant: register
  order: 20
  kind: list
  icon: "🏢"

fallback:
  on_offline: skip
  message: The NYCHA developments list was not available when this briefing ran.
