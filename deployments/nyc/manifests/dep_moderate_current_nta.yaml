id: dep_moderate_current_nta
type: baked
title: DEP Moderate (2.13 in/hr, current sea level), share of the neighborhood
answers: "share of the area modeled to flood in the DEP moderate rainstorm with today's sea level"
stone: cornerstone
tier: modeled
adapter: python_call

# Neighbourhood (polygon) evidence: runs for neighborhood and
# development_check queries against the resolved NTA polygon.
spatial:
  scope: polygon
  crs: EPSG:4326

config:
  module: app.areas.nta_evidence
  function: dep
  args:
    - {source: polygon_4326}
    - {const: dep_moderate_current}
  on_none: offline

provenance:
  date_modified: 2024-07-03
  retrieved_at: 2026-07-11
  source_name: NYC DEP Stormwater Flood Map, Moderate (2.13 in/hr, current sea level)
  source_url: https://data.cityofnewyork.us/Environment/NYC-Stormwater-Flood-Maps/9i7c-xyvv
  license: NYC Open Data Terms of Use
  doc_id: dep_moderate_current_nta
  citation: NYC DEP Stormwater Flood Map, Moderate (2.13 in/hr, current sea level), share of the neighborhood by depth class

narration:
  short: Share of this neighborhood in the DEP Moderate (2.13 in/hr, current sea level) scenario.
  template: "{narrative}"

display:
  order: 22
  kind: text
  icon: "🌧️"

fallback:
  on_offline: skip
